# Shared-host style: .htaccess may only use FileInfo directives (Options / Indexes / AuthConfig overrides are NOT granted).
<VirtualHost *:80>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        AllowOverride FileInfo
        Options -Indexes +FollowSymLinks
        Require all granted
    </Directory>
</VirtualHost>
