# Sub-directory deployment: the app is served at http://host/seo/ via Alias (public/ stays the only exposed directory).
<VirtualHost *:80>
    DocumentRoot /var/www/html
    Alias /seo /var/www/app/public
    <Directory /var/www/app/public>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
