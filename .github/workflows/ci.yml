# Written but NOT yet executed on GitHub (see docs/PRODUCTION_READINESS.md). The lint loop was checked locally against a deliberately broken
# file under both `bash -e` and `bash -eo pipefail`; the test commands were run in Docker; the GitHub-specific steps (checkout, setup-php,
# setup-node, service containers) have never run.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  php:
    name: PHP ${{ matrix.php }} / ${{ matrix.db }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.1', db: 'mariadb:10.11' }
          - { php: '8.3', db: 'mariadb:10.11' }
          - { php: '8.4', db: 'mariadb:11.8' }
          - { php: '8.3', db: 'mysql:8.4' }
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: test-root-pw
          MYSQL_ROOT_PASSWORD: test-root-pw
          MARIADB_DATABASE: sw_test
          MYSQL_DATABASE: sw_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest-root-pw || mariadb-admin ping -h 127.0.0.1 -uroot -ptest-root-pw"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl, dom, libxml, gd, fileinfo
          coverage: none
      - name: Lint
        run: |
          for f in $(git ls-files '*.php'); do
            out=$(php -l "$f" 2>&1) || { echo "$out"; exit 1; }
          done
      - name: Tests
        env:
          SW_TEST_DB_HOST: 127.0.0.1
          SW_TEST_DB_USER: root
          SW_TEST_DB_PASS: test-root-pw
        run: php tests/run.php

  js:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
        working-directory: tests/js
      - run: node --test
        working-directory: tests/js

  secrets:
    name: secret scan (working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Working tree only: the fork's early history contains a third-party placeholder key that is documented and not ours.
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4 detect --no-git --source /repo --redact --verbose
